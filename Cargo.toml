[package]
name = "vscode-rust"
version = "0.1.0"
edition = "2021"
description = "MVP Rust port of Visual Studio Code"

[lib]
name = "vscode_rust"
path = "src/lib.rs"

[[bin]]
name = "vscode-rust"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.34", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }
egui = "0.34"
egui_extras = "0.34"
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "html",
    "parsing",
    "regex-fancy",
    "plist-load",
] }
once_cell = "1"
rfd = "0.15"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
walkdir = "2.5"
regex = "1.10"
muda = "0.15"
winit = "0.30"
resvg = "0.45"
usvg = "0.45"
tiny-skia = "0.11"

[dev-dependencies]
egui_kittest = { version = "0.34", features = ["wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
