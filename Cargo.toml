[package]
name = "vscode-rust"
version = "0.1.0"
edition = "2021"
description = "MVP Rust port of Visual Studio Code"

[lib]
name = "vscode_rust"
path = "src/lib.rs"

[[bin]]
name = "vscode-rust"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.34", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }
egui = "0.34"
egui_extras = "0.34"
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "html",
    "parsing",
    "regex-fancy",
    "plist-load",
] }
once_cell = "1"
rfd = "0.15"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
walkdir = "2.5"
regex = "1.10"
muda = "0.15"
winit = "0.30"
resvg = "0.45"
usvg = "0.45"
tiny-skia = "0.11"
similar = "2"
notify = "6"
skrifa = "0.40"
# Extension webviews (WKWebView on macOS), embedded in the window.
wry = "0.57"
# Extension README / CHANGELOG pages.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# One file out of a catalogue .vsix (its translations), fetched by range.
miniz_oxide = "0.8"
# Marketplace extension icons.
image = { version = "0.25", default-features = false, features = ["png"] }
portable-pty = "0.9"
vt100 = "0.15"

[dev-dependencies]
egui_kittest = { version = "0.34", features = ["wgpu", "snapshot"] }


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

# Clearing a native menu item's key equivalent (muda 0.15 can't).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSEvent"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray"] }
